name: Deploy to DigitalOcean Droplet

on:
  workflow_run:
    workflows: ["Build & Push Docker Image"]
    types:
      - completed
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_REPO }}

    steps:
      # ----------------------------------------
      # 1. Deploy via SSH
      # ----------------------------------------
      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 22
          envs: DOCKERHUB_USERNAME,DOCKERHUB_REPO
          script: |
            set -e
            APP_DIR="/var/www/felmanicbrandz-mannequins-api"
            IMAGE="${DOCKERHUB_USERNAME}/${DOCKERHUB_REPO}:latest"

            echo "=== Pulling image: $IMAGE ==="
            docker pull $IMAGE

            echo "=== Updating docker-compose.yml ==="
            cd $APP_DIR
            sed -i 's|build:.*|image: '"$IMAGE"'|' docker-compose.yml
            sed -i '/dockerfile: Dockerfile/d' docker-compose.yml
            sed -i '/context: ./d' docker-compose.yml

            echo "=== Clearing stale bootstrap cache ==="
            rm -f bootstrap/cache/packages.php bootstrap/cache/services.php

            echo "=== Restarting containers ==="
            docker-compose down
            docker-compose up -d

            echo "=== Waiting for MySQL to be ready ==="
            sleep 10
            docker-compose exec -T app php artisan migrate --force || true
            docker-compose exec -T app php artisan config:cache || true
            docker-compose exec -T app php artisan route:cache || true
            docker-compose exec -T app php artisan view:cache || true
            docker-compose exec -T app chown -R www-data:www-data storage bootstrap/cache || true

            echo "=== Health Check ==="
            sleep 5
            HTTP_STATUS=$(curl -sL -o /dev/null -w "%{http_code}" http://localhost/up || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✓ App is healthy (HTTP 200)"
            else
              echo "✗ App health check failed (HTTP $HTTP_STATUS)"
              docker-compose logs --tail=50 app
              exit 1
            fi

            echo "=== Cleanup ==="
            docker system prune -f

            echo "=== Deployment complete ==="
